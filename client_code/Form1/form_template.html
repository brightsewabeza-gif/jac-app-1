<style>
/* =========================================
   JAC APP - THEME
========================================= */
.jac-app {
    --bg: #101827;
    --surface: #1e293b;
    --surface-hover: #263449;
    --text: #f1f5f9;
    --muted: #a0aec0;
    --border: #334155;
    --input-text: #f1f5f9;
    --brand: #087cf0;
    --brand-hover: #005bc4;
    --card-text: #cbd5e1;
    width: 100%;
    min-height: 100vh;
    padding-bottom: 30px;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    color-scheme: dark;
    transition: background 0.25s, color 0.25s;
}
.jac-app *, .jac-app *::before, .jac-app *::after {
    box-sizing: border-box;
}

.jac-app[data-theme="light"] {
    --bg: #f5f8ff;
    --surface: #ffffff;
    --surface-hover: #edf4ff;
    --text: #17233c;
    --muted: #718096;
    --border: #dce4f0;
    --input-text: #17233c;
    --card-text: #52627a;
    color-scheme: light;
}

/* HEADER */
.jac-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    padding: 20px 7%;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
}
.jac-brand {
    font-size: 27px;
    font-weight: 800;
    color: var(--brand);
    letter-spacing: -1px;
}
.jac-brand span, .jac-main-logo span {
    color: var(--text);
}
.jac-nav {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 18px;
}

/* THEME SWITCH */
.jac-theme-control {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    font-size: 13px;
    white-space: nowrap;
}
.jac-theme-label {
    color: var(--muted);
}
.jac-app[data-theme="dark"] .jac-dark-label,
.jac-app[data-theme="light"] .jac-light-label {
    color: var(--text);
    font-weight: bold;
}
.jac-theme-control input {
    appearance: none;
    -webkit-appearance: none;
    width: 46px;
    height: 25px;
    background: #64748b;
    border-radius: 30px;
    position: relative;
    cursor: pointer;
    margin: 0;
    flex-shrink: 0;
}
.jac-theme-control input:checked {
    background: var(--brand);
}
.jac-theme-control input::before {
    content: "";
    position: absolute;
    width: 19px;
    height: 19px;
    background: #fff;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    transition: transform 0.2s;
}
.jac-theme-control input:checked::before {
    transform: translateX(21px);
}
.jac-theme-control input:focus-visible {
    outline: 3px solid #60a5fa;
    outline-offset: 3px;
}

/* MAIN SEARCH */
.jac-main {
    text-align: center;
    padding: 85px 20px 35px;
}
.jac-main-logo {
    font-size: 62px;
    font-weight: 800;
    color: var(--brand);
    letter-spacing: -3px;
}
.jac-tagline {
    color: var(--muted);
    margin-top: 12px;
    font-size: 16px;
}

/* SEARCH FORM */
.jac-search-form {
    max-width: 690px;
    margin: 35px auto 28px;
    background: var(--surface);
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 8px 12px 8px 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
}
.jac-search-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    font-size: 16px;
    padding: 12px 8px;
    background: transparent;
    color: var(--input-text);
}
.jac-search-input::placeholder {
    color: var(--muted);
}
.jac-search-button {
    border: none;
    background: var(--brand);
    color: white;
    padding: 13px 24px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
}
.jac-search-button:hover {
    background: var(--brand-hover);
}

/* APP SHORTCUTS */
.jac-shortcuts {
    width: 100%;
    max-width: 1180px;
    margin: 25px auto 45px;
    padding: 0 14px;
}
.jac-shortcuts-title {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    text-align: center;
}
.jac-shortcut-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 16px;
}
.jac-shortcut {
    min-width: 0;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px 10px;
    border: 1px solid rgba(148,163,184,0.18);
    border-radius: 27px;
    background: #1e293b;
    color: #fff;
    text-decoration: none;
    transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
}
.jac-shortcut:hover {
    background: #263449;
    transform: translateY(-3px);
    box-shadow: 0 9px 22px rgba(0,0,0,0.16);
}
.jac-shortcut:focus-visible {
    outline: 3px solid #60a5fa;
    outline-offset: 3px;
}
.jac-shortcut-icon {
    width: 82px;
    height: 82px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 13px;
    border-radius: 25px;
    background: #fff;
    overflow: hidden;
}
.jac-shortcut-icon img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}
.jac-shortcut-icon svg {
    display: block;
    width: 100%;
    height: 100%;
}
.jac-shortcut-name {
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
}

/* SEARCH RESULTS */
.jac-results {
    display: none;
    max-width: 850px;
    margin: 35px auto;
    padding: 0 20px;
    text-align: left;
}
.jac-results h2 {
    color: var(--text);
    margin-bottom: 12px;
}
.jac-status {
    color: var(--muted);
    margin-bottom: 18px;
    font-size: 14px;
}
.jac-results-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}
.jac-result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
}
.jac-result-card:hover {
    background: var(--surface-hover);
}
.jac-result-card h3 {
    color: var(--brand);
    margin: 0 0 9px;
    font-size: 19px;
}
.jac-result-card p {
    color: var(--card-text);
    line-height: 1.6;
    font-size: 14px;
    margin: 0 0 10px;
}
.jac-result-card a {
    color: var(--brand);
    font-size: 13px;
    overflow-wrap: anywhere;
    text-decoration: none;
}
.jac-result-card a:hover {
    text-decoration: underline;
}

/* RESPONSIVE LAYOUT */
@media (max-width: 850px) {
    .jac-shortcut-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}
@media (max-width: 600px) {
    .jac-header {
        padding: 17px 5%;
    }
    .jac-theme-control {
        gap: 5px;
        font-size: 11px;
    }
    .jac-theme-control input {
        width: 40px;
    }
    .jac-theme-control input:checked::before {
        transform: translateX(15px);
    }
    .jac-main {
        padding-top: 65px;
    }
    .jac-main-logo {
        font-size: 46px;
    }
    .jac-search-form {
        padding: 6px 8px 6px 12px;
    }
    .jac-search-input {
        font-size: 14px;
    }
    .jac-search-button {
        padding: 12px 15px;
    }
    .jac-shortcut-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }
    .jac-shortcut {
        min-height: 135px;
        border-radius: 22px;
    }
    .jac-shortcut-icon {
        width: 70px;
        height: 70px;
        border-radius: 21px;
    }
    .jac-result-card {
        padding: 16px;
    }
}
</style>

<!-- THEME SWITCH -->
<script>
(function () {

    function initializeJacTheme() {

        const app = document.getElementById("jac-app");
        const toggle = document.getElementById("jac-theme-toggle");

        if (!app || !toggle) return;

        function applyTheme(theme) {

            const selectedTheme =
                theme === "light" ? "light" : "dark";

            app.setAttribute("data-theme", selectedTheme);
            toggle.checked = selectedTheme === "dark";

            toggle.setAttribute(
                "aria-label",
                selectedTheme === "dark"
                    ? "Switch to light mode"
                    : "Switch to dark mode"
            );

            try {
                localStorage.setItem("jac-theme", selectedTheme);
            } catch (error) {
                /* Theme still works if storage is unavailable. */
            }
        }

        let savedTheme = "dark";

        try {
            savedTheme = localStorage.getItem("jac-theme") || "dark";
        } catch (error) {
            savedTheme = "dark";
        }

        applyTheme(savedTheme);

        toggle.addEventListener("change", function () {
            applyTheme(toggle.checked ? "dark" : "light");
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initializeJacTheme);
    } else {
        initializeJacTheme();
    }

})();
</script>
