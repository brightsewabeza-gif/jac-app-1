<style>
.jac-app {
    font-family: Arial, sans-serif;
    background: #f5f8ff;
    color: #17233c;
    min-height: 100vh;
    padding-bottom: 30px;
}

.jac-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 7%;
    background: white;
    border-bottom: 1px solid #e7edf5;
}

.jac-brand {
    font-size: 27px;
    font-weight: bold;
    color: #087cf0;
}

.jac-brand span {
    color: #17233c;
}

.jac-nav a {
    margin-left: 20px;
    color: #34445f;
    text-decoration: none;
    font-size: 14px;
}

.jac-nav a:hover {
    color: #087cf0;
}

.jac-main {
    text-align: center;
    padding: 85px 20px 35px;
}

.jac-main-logo {
    font-size: 62px;
    font-weight: bold;
    color: #087cf0;
    letter-spacing: -3px;
}

.jac-main-logo span {
    color: #17233c;
}

.jac-tagline {
    color: #718096;
    margin-top: 12px;
    font-size: 16px;
}

.jac-search-form {
    max-width: 690px;
    margin: 35px auto;
    background: white;
    display: flex;
    align-items: center;
    border: 1px solid #dce4f0;
    border-radius: 50px;
    padding: 8px 12px 8px 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

.jac-search-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    font-size: 16px;
    padding: 12px 8px;
    background: transparent;
    color: #17233c;
}

.jac-search-button {
    border: none;
    background: #087cf0;
    color: white;
    padding: 13px 24px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
}

.jac-search-button:hover {
    background: #005bc4;
}

.jac-results {
    display: none;
    max-width: 850px;
    margin: 35px auto;
    padding: 0 20px;
    text-align: left;
}

.jac-results h2 {
    color: #17233c;
    margin-bottom: 12px;
}

.jac-status {
    color: #718096;
    margin-bottom: 18px;
    font-size: 14px;
}

.jac-results-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.jac-result-card {
    background: white;
    border: 1px solid #e1e8f2;
    border-radius: 12px;
    padding: 20px;
}

.jac-result-card h3 {
    color: #087cf0;
    margin-bottom: 9px;
    font-size: 19px;
}

.jac-result-card p {
    color: #52627a;
    line-height: 1.6;
    font-size: 14px;
    margin-bottom: 10px;
}

.jac-result-card a {
    color: #087cf0;
    font-size: 13px;
    overflow-wrap: anywhere;
    text-decoration: none;
}

.jac-result-card a:hover {
    text-decoration: underline;
}

.jac-suggestions {
    margin-top: 35px;
    color: #718096;
    font-size: 14px;
}

.jac-footer {
    text-align: center;
    padding: 25px;
    color: #8995a8;
    font-size: 13px;
    border-top: 1px solid #e7edf5;
    background: white;
}

@media (max-width: 600px) {
    .jac-header {
        padding: 17px 5%;
    }

    .jac-main {
        padding-top: 65px;
    }

    .jac-main-logo {
        font-size: 46px;
    }

    .jac-search-form {
        padding: 6px 8px 6px 12px;
    }

    .jac-search-input {
        font-size: 14px;
    }

    .jac-search-button {
        padding: 12px 15px;
    }

    .jac-nav a {
        margin-left: 8px;
        font-size: 12px;
    }
}
</style>

<div class="jac-app">

    <!-- HEADER -->
    <header class="jac-header">

        <div class="jac-brand">
            JAC<span> APP</span>
        </div>

        <nav class="jac-nav">
            <anvil-dropzone name="$dz_4hibr4"></anvil-dropzone>
        </nav>

    </header>

    <!-- SEARCH PAGE -->
    <main id="jac-home" class="jac-main">

        <div class="jac-main-logo">
            JAC<span> APP</span>
        </div>

        <!-- SEARCH FORM -->
        <form anvil:on-dom:submit="self.search_form_submit" class="jac-search-form">

            <input anvil:dom-node="search_input" type="search" placeholder="Search anything on the internet..." aria-label="Search the web" required class="jac-search-input" />

            <button type="submit" class="jac-search-button">
                Search
            </button>

        </form>

        <!-- RESULTS AREA -->
        <section anvil:dom-node="results_section" id="jac-results-section" aria-live="polite" class="jac-results">

            <h2>Search Results</h2>

            <p anvil:dom-node="search_status" class="jac-status">
                Ready to search.
            </p>

            <div anvil:dom-node="search_results" class="jac-results-list"></div>

        </section>

        <div class="jac-suggestions">
            Start exploring the web
        </div>

    </main>

    <!-- ABOUT -->
    <section id="jac-about">
        <anvil-dropzone name="$dz_hehbsw"></anvil-dropzone>
    </section>

    <!-- FOOTER -->

</div>
