<style>
/* =================================
   JAC APP - APP SHORTCUTS
================================= */

.jac-shortcuts {
    width: 100%;
    max-width: 1150px;
    margin: 25px auto 45px;
    padding: 0 20px;
    box-sizing: border-box;
}

.jac-shortcuts-title {
    color: var(--text, #f1f5f9);
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 18px;
}

.jac-shortcut-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 18px;
}

.jac-shortcut {
    min-height: 165px;
    padding: 24px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;

    background: var(--surface, #1e293b);
    border: 1px solid var(--border, #334155);
    border-radius: 28px;

    text-decoration: none;
    color: var(--text, #f1f5f9);

    transition: transform .2s ease,
                border-color .2s ease,
                background .2s ease;
    box-sizing: border-box;
}

.jac-shortcut:hover {
    transform: translateY(-5px);
    border-color: #087cf0;
    background: var(--surface-hover, #263449);
}

.jac-shortcut-icon {
    width: 82px;
    height: 82px;
    background: #ffffff;
    border-radius: 27px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 13px;
    box-sizing: border-box;
    overflow: hidden;
}

.jac-shortcut-icon img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.jac-shortcut-name {
    font-size: 15px;
    font-weight: 700;
    text-align: center;
}

/* Tablet */
@media (max-width: 850px) {
    .jac-shortcut-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

/* Mobile */
@media (max-width: 480px) {
    .jac-shortcut-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .jac-shortcut {
        min-height: 145px;
        padding: 18px 8px;
    }

    .jac-shortcut-icon {
        width: 70px;
        height: 70px;
    }
}
</style>
